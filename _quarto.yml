project:
  type: website

website:
  title: "KB-SB-Stack documentation"
  site-url: https://kb-labb.github.io/stack-docs/
  navbar:
    left:
      - href: index.qmd
        text: Home
      - about.qmd
    right:
      - icon: github
        href: https://github.com/kb-labb/stack-docs
        aria-label: GitHub
  sidebar:
    contents:
      - index.qmd
      - section: "Guides"
        contents: guides/*
  repo-url: https://github.com/kb-labb/stack-docs
  repo-branch: main
  repo-actions: [source, issue]

format:
  html:
    theme:
      light: [cosmo, brand]
      dark: [darkly, brand]
    css: styles.css
    toc: true
    include-after-body:
      - _includes/annotation-highlight-fix.html
      - _includes/annotation-click-highlight.html



